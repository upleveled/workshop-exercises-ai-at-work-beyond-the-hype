<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timesheets · Hours</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        color: #1f2937;
        background: #f6f7f9;
        display: flex;
        min-height: 100vh;
      }
      nav {
        width: 220px;
        background: #1e293b;
        color: #cbd5e1;
        padding: 20px 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      nav .logo {
        color: #fff;
        font-weight: 700;
        font-size: 20px;
        padding: 0 12px 20px;
      }
      nav a {
        color: inherit;
        text-decoration: none;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 14px;
      }
      nav a.active {
        background: #334155;
        color: #fff;
      }
      nav .account {
        margin-top: auto;
        padding: 12px;
        font-size: 13px;
        border-top: 1px solid #334155;
      }
      main {
        flex: 1;
        padding: 24px 32px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 24px;
        margin: 0;
        flex: 1;
      }
      button,
      select {
        font: inherit;
        font-size: 14px;
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid #d1d5db;
        background: #fff;
      }
      button.primary {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }
      button:disabled {
        opacity: 0.5;
      }
      .toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 20px;
        font-size: 14px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-bottom: 20px;
      }
      .card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 16px;
      }
      .card .label {
        font-size: 13px;
        color: #6b7280;
      }
      .card .value {
        font-size: 24px;
        font-weight: 600;
        margin-top: 4px;
      }
      .panel {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 16px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        padding: 10px 8px;
        border-bottom: 1px solid #e5e7eb;
      }
      .error {
        text-align: center;
        padding: 48px 16px;
      }
      .error .icon {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #fee2e2;
        color: #dc2626;
        font-size: 28px;
        font-weight: 700;
        line-height: 48px;
        margin: 0 auto 12px;
      }
      .error p {
        color: #6b7280;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="logo">Hours</div>
      <a class="active" href="#">Timesheets</a>
      <a href="#">Projects</a>
      <a href="#">Clients</a>
      <a href="#">Invoices</a>
      <a href="#">Team</a>
      <a href="#">Reports</a>
      <a href="#">Settings</a>
      <div class="account">Harbour Room<br />Office team</div>
    </nav>

    <main>
      <header>
        <h1>Timesheets</h1>
        <button>Export</button>
        <button class="primary" id="invoice" disabled>Create invoice</button>
      </header>

      <div class="toolbar">
        <button>‹</button>
        <strong>Week 43 · 19–25 Oct 2026</strong>
        <button>›</button>
        <select>
          <option>Daan Bos · Event technician</option>
        </select>
        <select>
          <option>Lumen Bikes</option>
        </select>
      </div>

      <div class="cards">
        <div class="card">
          <div class="label">Total hours</div>
          <div class="value" id="hours">–</div>
        </div>
        <div class="card">
          <div class="label">Hourly rate</div>
          <div class="value" id="rate">–</div>
        </div>
        <div class="card">
          <div class="label">Invoice amount</div>
          <div class="value" id="amount">–</div>
        </div>
      </div>

      <div class="panel" id="content"></div>
    </main>

    <script>
      function showError() {
        document.getElementById('content').innerHTML = `
          <div class="error">
            <div class="icon">!</div>
            <strong>We couldn't load this timesheet</strong>
            <p>Something went wrong. Please try again later.</p>
            <button onclick="load()">Try again</button>
          </div>`;
      }

      function render(timesheet) {
        document.getElementById('hours').textContent = timesheet.totals.hours;
        document.getElementById('rate').textContent =
          `${timesheet.hourlyRate} ${timesheet.currency}`;
        document.getElementById('amount').textContent =
          `${timesheet.totals.amount} ${timesheet.currency}`;
        document.getElementById('content').innerHTML = `
          <table>
            <tr><th>Date</th><th>Task</th><th>Start</th><th>End</th></tr>
            ${timesheet.entries
              .map(
                (entry) =>
                  `<tr><td>${entry.date}</td><td>${entry.task}</td><td>${entry.start}</td><td>${entry.end}</td></tr>`,
              )
              .join('')}
          </table>`;
        document.getElementById('invoice').disabled = false;
      }

      async function load() {
        const response = await fetch('api/timesheets/2026-W43.json');
        const body = await response.json();
        if (body.errors) {
          console.error('Timesheet request failed');
          showError();
          return;
        }
        render(body.data.timesheet);
      }

      load();
    </script>
  </body>
</html>
